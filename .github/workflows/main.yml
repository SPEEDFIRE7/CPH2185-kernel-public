name: Check Kernel Name Files

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Kernel source repo (owner/name)'
        required: true
        default: 'SPEEDFIRE7/kernel_transsion_ums9230'
      branch:
        description: 'Branch'
        required: true
        default: 'main'
      defconfig:
        description: 'Defconfig path (optional, e.g. arch/arm64/configs/xxx_defconfig)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" \
            "https://github.com/${{ inputs.repo }}.git" src

      - name: Scan files that change the kernel name
        working-directory: src
        run: |
          {
          echo "# Kernel name check"
          echo

          echo "## 1) Makefile version fields"
          grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION|NAME)\s*=' Makefile || true
          echo

          echo "## 2) localversion* files"
          find . -maxdepth 2 -name 'localversion*' -type f -print \
            -exec sh -c 'echo "   -> $(cat "$1")"' _ {} \; || true
          echo

          echo "## 3) scripts/setlocalversion"
          if [ -f scripts/setlocalversion ]; then
            echo "exists"
            grep -nE 'echo|printf|scm_version|LOCALVERSION' scripts/setlocalversion | head -30
          else
            echo "not found"
          fi
          echo

          echo "## 4) Kconfig/defconfig: LOCALVERSION settings"
          grep -rnE '^CONFIG_LOCALVERSION(_AUTO)?=' arch/*/configs/ 2>/dev/null | head -50 || true
          echo

          echo "## 5) Hostname / build user / compile-by"
          grep -rnE '^CONFIG_DEFAULT_HOSTNAME=' arch/*/configs/ 2>/dev/null | head -20 || true
          grep -nE 'KBUILD_BUILD_(USER|HOST|TIMESTAMP|VERSION)' Makefile scripts/mkcompile_h 2>/dev/null || true
          echo

          echo "## 6) UTS / uname strings"
          grep -rnE 'UTS_RELEASE|UTS_VERSION|UTS_SYSNAME|UTS_NODENAME' include/ init/ scripts/mkcompile_h 2>/dev/null | head -30 || true
          echo

          echo "## 7) Files containing hard-coded custom kernel names"
          grep -rIlE 'CONFIG_LOCALVERSION="[^"]+"' --include='*defconfig' . 2>/dev/null | head -20 || true
          echo

          if [ -n "${{ inputs.defconfig }}" ] && [ -f "${{ inputs.defconfig }}" ]; then
            echo "## 8) Selected defconfig: ${{ inputs.defconfig }}"
            grep -nE 'LOCALVERSION|HOSTNAME|UTS' "${{ inputs.defconfig }}" || echo "no matches"
          fi
          } | tee "$GITHUB_WORKSPACE/report.md"

      - name: Add report to job summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kernel-name-report
          path: report.md
